{% extends "ocorrencias/base.html" %}

{% block titulo %}Registrar ocorrência{% endblock %}

{% block conteudo %}
  <a href="{% url 'ocorrencias:entrada' %}" class="d-inline-block py-2 fw-semibold">← Voltar</a>
  <h1 class="h3 mb-3">Registrar ocorrência</h1>

  <form method="post" novalidate>
    {% csrf_token %}
    {% for campo in form %}
      <div class="mb-3">
        <label for="{{ campo.id_for_label }}" class="form-label fw-semibold">{{ campo.label }}</label>
        {{ campo }}
        {% for erro in campo.errors %}
          <div class="text-danger fw-semibold mt-1" role="alert">⚠ {{ erro }}</div>
        {% endfor %}
      </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Enviar ocorrência</button>
  </form>
{% endblock %}
